<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akhil Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8d1c5;font-family:Arial,sans-serif}
.phone{max-width:430px;height:100vh;margin:auto;background:#efe7da;display:flex;flex-direction:column;overflow:hidden}
.header{height:64px;background:#075e54;color:#fff;display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
.back{font-size:30px}.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#ddd}.avatar img{width:100%;height:100%;object-fit:cover}
.name{font-size:17px;font-weight:600}.online{font-size:12px;opacity:.8}.icons{margin-left:auto;font-size:23px}
.chat{flex:1;overflow-y:auto;padding:18px 12px;background:#efe7da;background-image:radial-gradient(#d8cec0 1px,transparent 1px);background-size:18px 18px}
.date{margin:auto auto 16px;width:max-content;background:#e6dfd2;color:#6d655b;padding:6px 12px;border-radius:8px;font-size:12px}
.msg{max-width:78%;padding:9px 11px 7px;border-radius:8px;margin:8px 0;box-shadow:0 1px 1px #0002;line-height:1.4;font-size:15px;animation:show .3s}
.them{background:#fff;margin-right:auto;border-top-left-radius:2px}.me{background:#d9fdd3;margin-left:auto;border-top-right-radius:2px}
.time{font-size:10px;color:#777;float:right;margin:6px 0 0 10px}.tick{color:#4285f4}
.typing{width:64px;background:#fff;border-radius:9px;padding:10px 13px;margin:8px 0;box-shadow:0 1px 1px #0002}
.dot{display:inline-block;width:6px;height:6px;background:#999;border-radius:50%;margin:0 2px;animation:b 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
.start{padding:18px;text-align:center;background:#075e54}.start button{background:#25d366;color:#fff;border:0;border-radius:22px;padding:12px 25px;font-size:16px;font-weight:bold}
.final{display:none;text-align:center;background:#fff;padding:20px;color:#333}.final .heart{font-size:40px}.final h2{color:#075e54;margin:5px}.final p{margin:6px}
@keyframes show{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes b{0%,60%,100%{transform:none}30%{transform:translateY(-4px)}}
</style>
</head>
